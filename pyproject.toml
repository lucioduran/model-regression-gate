[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-regression-gate"
version = "0.1.0"
description = "Auditable paired promotion decisions for versioned classifier tasks"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
model-regression-gate = "model_regression_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
