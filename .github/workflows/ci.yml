name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.0'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: mypy src scripts
      - run: python scripts/replay.py
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Installed wheel smoke check outside checkout
        shell: bash
        run: |
          python -m venv /tmp/gate-smoke
          /tmp/gate-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/gate-smoke/bin/model-regression-gate \
            --tasks "$GITHUB_WORKSPACE/evidence/evaluation/tasks.json" \
            --reference "$GITHUB_WORKSPACE/evidence/evaluation/predictions/baseline.json" \
            --candidate "$GITHUB_WORKSPACE/evidence/evaluation/predictions/improved.json" \
            --policy "$GITHUB_WORKSPACE/data/policy.json"
